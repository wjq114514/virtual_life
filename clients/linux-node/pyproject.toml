[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "virtual-life-linux"
version = "0.1.0"
description = "Linux desktop host daemon, TUI and CLI for the Virtual Life companion runtime"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "websockets>=12,<18",
  "textual>=0.80,<2",
  "dbus-next>=0.2.3,<1",
]

[project.scripts]
vl = "virtual_life_linux.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/virtual_life_linux"]

[tool.hatch.build.targets.wheel.force-include]
"integrations" = "virtual_life_linux/integrations"
"packaging/config.example.toml" = "virtual_life_linux/assets/config.example.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
