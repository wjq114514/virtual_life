[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "virtual-life-runtime"
version = "0.1.0"
description = "A node-based runtime for a persistent AI companion"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "numpy>=2.0,<3",
  "paramiko>=3.5,<5",
  "pillow>=13.0.0",
  "python-multipart>=0.0.9,<1",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]
# Optional: only needed for dataset generation post-processing, training,
# evaluation and ONNX export. The runtime service can use either backend.
train = [
  "accelerate>=1.2,<2",
  "onnx>=1.17,<2",
  "onnxruntime>=1.20,<2",
  "torch>=2.6,<3",
  "transformers>=4.48,<6",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["backend/virtual_life"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
