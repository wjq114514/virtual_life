<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>虚拟生命 · 观测台</title>
    <link rel="stylesheet" href="./app.css" />
    <script>
      // Resolve the theme before first paint so the page never flashes.
      (function () {
        try {
          var saved = localStorage.getItem('vl.theme');
          if (saved !== 'light' && saved !== 'dark') {
            saved = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.dataset.theme = saved;
        } catch (error) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div class="shell" id="shell">
      <aside class="rail" aria-label="主导航">
        <div class="rail-brand">
          <span class="brand-mark" aria-hidden="true">✳</span>
          <span class="brand-text">
            虚拟生命
            <small>OBSERVATORY</small>
          </span>
        </div>

        <nav class="rail-nav" id="rail-nav">
          <button class="nav-item is-active" type="button" data-view="overview">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-4H4zM14 8h6V4h-6z" />
            </svg>
            <span class="nav-label">总览</span>
          </button>
          <button class="nav-item" type="button" data-view="logs">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 6h16M4 12h10M4 18h13" />
            </svg>
            <span class="nav-label">日志</span>
          </button>
          <button class="nav-item" type="button" data-view="events">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 12h4l2.5-7 4 14 2.5-7h5" />
            </svg>
            <span class="nav-label">事件</span>
          </button>
          <button class="nav-item" type="button" data-view="memories">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7.5 12 4l8 3.5v9L12 20l-8-3.5zM4 7.5 12 11l8-3.5M12 11v9" />
            </svg>
            <span class="nav-label">记忆</span>
          </button>
          <button class="nav-item" type="button" data-view="graph">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="6" cy="7" r="2.4" />
              <circle cx="18" cy="8" r="2.4" />
              <circle cx="11" cy="17" r="2.4" />
              <path d="M8.1 8.1 15.9 8M7.2 9.3l2.6 5.4M16.5 10.2l-4 4.6" />
            </svg>
            <span class="nav-label">知识图谱</span>
          </button>
          <button class="nav-item" type="button" data-view="inner">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 21s-7-4.4-7-10a4.2 4.2 0 0 1 7-3 4.2 4.2 0 0 1 7 3c0 5.6-7 10-7 10z" />
            </svg>
            <span class="nav-label">内心活动</span>
          </button>
          <button class="nav-item" type="button" data-view="devices">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="5" width="12" height="9" rx="1.6" />
              <rect x="17" y="9" width="4.5" height="10" rx="1.4" />
              <path d="M6 18h7" />
            </svg>
            <span class="nav-label">设备</span>
          </button>
        </nav>

        <div class="rail-foot">
          <div class="conn" id="conn">
            <span class="conn-dot" data-state="idle" aria-hidden="true"></span>
            <span id="conn-text">未连接</span>
          </div>
          <button class="btn btn-ghost btn-block" type="button" id="btn-session">
            管理令牌
          </button>
        </div>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <div class="topbar-main">
            <h1 id="view-title">总览</h1>
            <p id="view-sub">伙伴状态、记忆与运行时的整体视图</p>
          </div>
          <div class="topbar-actions">
            <label class="field field-inline">
              <span>伙伴</span>
              <select id="companion-select" aria-label="选择伙伴"></select>
            </label>
            <label class="switch" title="自动刷新">
              <input type="checkbox" id="auto-refresh" checked />
              <span>实时</span>
            </label>
            <button class="btn" type="button" id="btn-refresh">刷新</button>
            <button class="btn btn-icon" type="button" id="btn-theme" title="切换主题" aria-label="切换主题">
              ◐
            </button>
          </div>
        </header>

        <div class="banner" id="banner" role="status" hidden></div>
        <main class="view" id="view" tabindex="-1"></main>
      </div>
    </div>

    <dialog id="auth-dialog" aria-labelledby="auth-title">
      <form id="auth-form" method="dialog">
        <h2 id="auth-title">连接运行时</h2>
        <p class="dialog-sub">
          输入运行时的管理令牌。令牌只会写入 HttpOnly 会话 Cookie，页面脚本读不到它。
        </p>
        <label class="field field-block">
          <span>管理令牌</span>
          <input type="password" id="auth-token" autocomplete="current-password" placeholder="local-dev-token" required />
        </label>
        <p class="dialog-error" id="auth-error" hidden></p>
        <div class="dialog-actions">
          <button class="btn btn-ghost" type="button" id="auth-cancel">取消</button>
          <button class="btn btn-primary" type="submit" id="auth-submit">连接</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
