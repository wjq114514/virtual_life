<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>虚拟生命 · 实时日志与流程追踪</title>
    <link rel="stylesheet" href="./app.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">✳</span>
          <span>虚拟生命<small>VIRTUAL LIFE · LIVE</small></span>
        </div>
        <div class="topbar-status">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="connection">未连接</span>
        </div>
      </header>

      <main class="panels">
        <section class="panel" id="logs-pane" aria-labelledby="logs-title">
          <header class="panel-head">
            <h1 id="logs-title">实时日志</h1>
            <div class="panel-actions">
              <label class="level-filter">
                级别
                <select id="level-filter">
                  <option value="ALL">全部</option>
                  <option value="DEBUG">DEBUG</option>
                  <option value="INFO">INFO</option>
                  <option value="WARN">WARN</option>
                  <option value="ERROR">ERROR</option>
                  <option value="CRIT">CRIT</option>
                </select>
              </label>
              <label class="follow">
                <input id="follow" type="checkbox" checked /> 跟随
              </label>
              <button id="logs-clear" type="button">清空</button>
            </div>
          </header>
          <div class="log-view" id="log-view" role="log" aria-live="polite">
            <div class="log-empty" id="log-empty">
              连接服务器后，这里会实时滚动运行日志。
            </div>
          </div>
          <footer class="panel-foot">
            <span id="logs-status">未连接</span>
          </footer>
        </section>

        <section class="panel" id="flow-pane" aria-labelledby="flow-title">
          <header class="panel-head">
            <h1 id="flow-title">流程追踪</h1>
            <div class="panel-actions">
              <button id="flow-pause" type="button">暂停</button>
              <button id="flow-clear" type="button">清空</button>
            </div>
          </header>
          <div class="flow-view" id="flow-view" role="log" aria-live="polite">
            <div class="flow-empty" id="flow-empty">
              等待运行事件…（对话、迁移、记忆、主动陪伴）
            </div>
          </div>
          <footer class="panel-foot">
            <span id="flow-status">未连接</span>
          </footer>
        </section>
      </main>
    </div>

    <dialog id="connection-dialog" aria-labelledby="connection-title">
      <form method="dialog" id="connection-form">
        <h2 id="connection-title">连接服务器</h2>
        <label>
          管理令牌
          <input
            id="token"
            type="password"
            autocomplete="off"
            maxlength="512"
            required
          />
        </label>
        <label class="remember">
          <input id="remember" type="checkbox" checked /> 记住会话（HttpOnly Cookie）
        </label>
        <p class="error" id="connection-error" role="alert"></p>
        <div class="dialog-actions">
          <button type="submit" id="connect">连接</button>
          <button type="button" id="disconnect">断开</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
